[package]
name = "codex-o-pet-bridge"
version = "0.2.0"
edition = "2024"
publish = false
description = "Connect Codex lifecycle activity to the o-pet desktop companion."
license = "AGPL-3.0-only"
repository = "https://github.com/lzhao013-web/codex-o-pet"

[dependencies]
interprocess = "2.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"
